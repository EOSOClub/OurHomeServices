# Paperless-ngx: document archive with OCR, for bills and receipts. Pulls bill
# emails from Proton Mail through the Bridge (../proton-bridge) and takes phone
# photos / uploads of paper ones.
#
# One-time setup (from this folder):
#   docker network create ourhome_net
#   cp .env.example .env          # then set the secrets
#   docker compose up -d
#
# Data stays in this folder: ./data (database, media, search index),
# ./consume (drop files in to import them), ./export (backups). All gitignored.

name: ourhome-paperless

services:
  broker:
    image: docker.io/library/redis:8
    container_name: paperless_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data

  db:
    image: docker.io/library/postgres:17
    container_name: paperless_db
    restart: unless-stopped
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DBPASS:?set PAPERLESS_DBPASS in .env}

  webserver:
    # Pinned so `docker compose pull` never jumps a version by surprise. To
    # update, bump the tag (see the Updating section in README.md).
    image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
    container_name: paperless
    restart: unless-stopped
    depends_on:
      - db
      - broker
      - gotenberg
      - tika
    ports:
      # Localhost only by default (put a reverse proxy / tunnel in front).
      # Set PAPERLESS_BIND=0.0.0.0 to reach it from phones on your LAN.
      - "${PAPERLESS_BIND:-127.0.0.1}:${PAPERLESS_PORT:-8200}:8000"
    volumes:
      - ./data/data:/usr/src/paperless/data
      - ./data/media:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      USERMAP_UID: ${PUID:-1000}
      USERMAP_GID: ${PGID:-1000}
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: ${PAPERLESS_DBPASS}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?set PAPERLESS_SECRET_KEY in .env}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?set PAPERLESS_ADMIN_PASSWORD in .env}
      # The address you open Paperless at. Wrong = CSRF errors on login.
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8200}
      PAPERLESS_TIME_ZONE: ${TZ:-America/Chicago}
      PAPERLESS_OCR_LANGUAGE: ${PAPERLESS_OCR_LANGUAGE:-eng}
      # Some emailed PDF bills are digitally signed; OCR refuses those otherwise.
      PAPERLESS_OCR_USER_ARGS: '{"invalidate_digital_signatures": true}'
      # Phone photos are often skewed or sideways.
      PAPERLESS_OCR_ROTATE_PAGES: "true"
      PAPERLESS_OCR_DESKEW: "true"
      # Tika + Gotenberg turn .eml files and HTML-only emails into PDFs, which
      # is how most emailed bills arrive.
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_FILENAME_FORMAT: "{{ document_type }}/{{ correspondent }}/{{ created_year }}/{{ title }}"
      # Check mail every 10 minutes.
      PAPERLESS_EMAIL_TASK_CRON: "*/10 * * * *"
      # protonmail-bridge resolves to a private Docker IP, which Paperless
      # refuses for mail servers unless this is on.
      PAPERLESS_EMAIL_ALLOW_INTERNAL_HOSTS: "true"
    networks:
      - default
      # Only to reach protonmail-bridge:143. Paperless runs without it.
      - ourhome

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    container_name: paperless_gotenberg
    restart: unless-stopped
    # Paperless's recommended hardening: no JavaScript in rendered emails, and
    # only local files.
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    # Pinned to 3.x: Tika 4 answers Paperless's requests with 406 Not
    # Acceptable, so every .eml import fails. Unpin once Paperless supports 4.
    image: docker.io/apache/tika:3.3.1.0
    container_name: paperless_tika
    restart: unless-stopped

networks:
  ourhome:
    name: ${DOCKER_NETWORK:-ourhome_net}
    external: true
